Multipackage with OS condition

---
- hosts: webservers
  become: true

  tasks:
    - name: Install packages on RedHat family
      when: ansible_os_family == "RedHat"
      yum:
        name: "{{ item }}"
        state: present
      with_items:
        - vim
        - zip
        - curl
        - nginx

    - name: Install packages on Debian family
      when: ansible_os_family == "Debian"
      apt:
        name: "{{ item }}"
        state: present
      with_items:
        - vim
        - zip
        - curl
        - nginx
   
